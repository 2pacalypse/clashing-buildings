server {
    listen 80;
    server_name _;

    # Request size limit (prevents accepting massive payloads before validation)
    client_max_body_size 50m;

    # Common proxy headers applied to all locations
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # API documentation endpoints
    location = /docs {
        proxy_pass http://api:8000;
    }

    location = /openapi.json {
        proxy_pass http://api:8000;
    }

    # Forward API requests to the FastAPI service
    location /api/ {
        proxy_pass http://api:8000;
    }

    # Serve frontend static files via the frontend service
    location / {
        proxy_pass http://frontend:80;
    }
}
