<!DOCTYPE html>

    <style>
        /* Hourglass shake/vibration animation during polling */
        @keyframes shake-hourglass {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-2px); }
            75% { transform: translateX(2px); }
        }
        
        .sample-btn.polling {
            animation: shake-hourglass 0.4s linear infinite;
            opacity: 0.6;
            background-color: rgba(100, 100, 100, 0.3);
            cursor: not-allowed;
        }
        
        .sample-btn.polling:disabled {
            color: #999;
        }
    </style>

    <script type="module" src="app.js"></script>
    <script>
    // Copy sample function with tooltip feedback
    window.copySample = function(sampleKey, type) {
        if (!window.samples) return;
        const sample = window.samples[sampleKey];
        if (!sample) return;
        const field = document.getElementById('copy-input-' + sampleKey);
        if (!field) return;
        const text = JSON.stringify(sample);


        function flashField(field) {
            if (!field) return;
            const original = field.value;
            const originalAlign = field.style.textAlign || '';
            try {
                field.style.textAlign = 'center';
                field.classList.add('flash');
                field.value = '✅ Copied';
            } catch (e) {}
            setTimeout(() => {
                try {
                    field.classList.remove('flash');
                    field.style.textAlign = originalAlign;
                    field.value = original;
                } catch (e) {}
            }, 1200);
        }

        // Try Clipboard API first
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(() => {
                field.value = text;
                field.blur();
                flashField(field);
            }).catch(() => {
                try {
                    field.value = text;
                    field.select();
                    field.setSelectionRange(0, 99999);
                    document.execCommand('copy');
                } catch (e) {}
                field.blur();
                flashField(field);
            });
        } else {
            try {
                field.value = text;
                field.select();
                field.setSelectionRange(0, 99999);
                document.execCommand('copy');
            } catch (e) {}
            field.blur();
            flashField(field);
        }
    };

    // Populate copy fields on load (fallback - app.js also populates)
    document.addEventListener('DOMContentLoaded', function() {
        if (!window.samples) return;
        ['sampleInputOne','sampleOutputOne','sampleInputTwo','sampleOutputTwo','ready_XXS','ready_XS','ready_S','ready_M','ready_L','ready_XL'].forEach(function(key) {
            const field = document.getElementById('copy-input-' + key);
            if (field && window.samples[key]) {
                field.value = JSON.stringify(window.samples[key]);
            }
        });
    });
    </script>
</body>
