<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Building Clashes 3D Visualizer</title>
    <link rel="stylesheet" href="styles.css">
    
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <h1>🏢 Building Clashes 3D</h1>
            
            <div class="section">
                <h2>Sample Inputs</h2>
                <p style="font-size: 0.8rem; color: #888; margin-bottom: 8px;">Click to toggle (select multiple)</p>
                <button class="sample-btn" data-sample="sampleInputOne" onclick="loadSample('sampleInputOne')">Sample Input 1</button>
                <button class="sample-btn" data-sample="sampleInputTwo" onclick="loadSample('sampleInputTwo')">Sample Input 2</button>
                <button class="sample-btn" data-sample="sampleOutputOne" onclick="loadSample('sampleOutputOne')">Sample Output 1</button>
                <button class="sample-btn" data-sample="sampleOutputTwo" onclick="loadSample('sampleOutputTwo')">Sample Output 2</button>
            </div>
            
            <div class="section">
                <h2>Legend</h2>
                <div id="legend" class="legend"></div>
            </div>
            
            <div class="controls">
                <strong>Controls:</strong><br>
                🖱️ Left drag: Rotate<br>
                🖱️ Right drag: Pan<br>
                🔍 Scroll: Zoom<br>
                <button onclick="resetCamera()" class="view-btn">Reset Camera</button>
                <button onclick="topDownView()" class="view-btn">Top-Down View</button>
                <button onclick="sideView()" class="view-btn">Side View</button>
            </div>
        </div>
        
        <div id="canvas-container">
            <canvas id="three-canvas"></canvas>
            <div id="overlay-info" class="overlay-info"></div>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
