<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Building Clashes 3D Visualizer</title>
    <link rel="stylesheet" href="styles.css">
    
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <h1>🏢 Building Clashes 3D</h1>
            
            <div class="section">
                <h2>Sample Inputs</h2>
                <p style="font-size: 0.8rem; color: #888; margin-bottom: 8px;">Click to toggle (select multiple)</p>
                <div class="sample-row">
                    <button class="sample-btn" data-sample="sampleInputOne" onclick="loadSample('sampleInputOne')">Sample Input 1</button>
                    <button class="sample-btn" data-sample="sampleOutputOne" onclick="loadSample('sampleOutputOne')">Sample Output 1</button>
                </div>
                <div class="sample-row">
                    <button class="sample-btn" data-sample="sampleInputTwo" onclick="loadSample('sampleInputTwo')">Sample Input 2</button>
                    <button class="sample-btn" data-sample="sampleOutputTwo" onclick="loadSample('sampleOutputTwo')">Sample Output 2</button>
                </div>
            </div>

            <div class="section">
                <h2>Input Form</h2>
                <p style="font-size: 0.8rem; color: #888; margin-bottom: 8px;">Paste a FeatureCollection GeoJSON (see samples)</p>
                <textarea id="input-json" placeholder="Paste GeoJSON here"></textarea>
                <div class="btn-row">
                    <button class="btn-primary" onclick="sendInputFromForm()">Send</button>
                </div>
            </div>
            
            
            
        </div>
        
        <div id="canvas-container">
            <canvas id="three-canvas"></canvas>
            <div id="overlay-info" class="overlay-info"></div>
        </div>
    </div>

    <footer class="footer">
        <div class="footer-inner">
            <div id="legend" class="legend footer-legend" style="display:none;"></div>
        </div>
    </footer>

    <div class="controls floating-controls">
        <strong>Controls:</strong>
        <div class="controls-desc">
            🖱️ Left drag: Rotate<br>
            🖱️ Right drag: Pan<br>
            🔍 Scroll: Zoom
        </div>
        <button onclick="resetCamera()" class="view-btn">Reset Camera</button>
        <button onclick="topDownView()" class="view-btn">Top-Down View</button>
        <button onclick="sideView()" class="view-btn">Side View</button>
        <label class="control-checkbox" style="display:flex; align-items:center; gap:8px; margin-top:8px; font-size:0.9rem; align-self:flex-end;">
            <input id="show-legend-checkbox" type="checkbox">
            Show legend
        </label>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
